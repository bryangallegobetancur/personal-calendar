<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.json?v=2" />
    <title>Personal Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var themes = ['aurora', 'midnight', 'dusk']
        var theme = localStorage.getItem('theme')
        if (themes.indexOf(theme) === -1) {
          var legacy = theme === 'dark' || theme === 'light' ? theme : null
          if (!legacy) {
            legacy = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          theme = legacy === 'dark' ? 'midnight' : 'aurora'
        }
        document.documentElement.classList.add('theme-' + theme)
        if (theme === 'midnight' || theme === 'dusk') {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function () {})
      }
    </script>
  </body>
</html>
